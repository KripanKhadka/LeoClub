<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Received - Leo Club of Kathmandu Samakhusi</title>
<link href="/static/site/css/leo-club.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/site/leo-club-logo.png">
<style>
body{margin:0;background:#f6f8fb;font-family:Arial,sans-serif}.box{max-width:650px;margin:70px auto;background:#fff;padding:45px 30px;text-align:center;border-radius:15px;box-shadow:0 10px 35px rgba(0,0,0,.08)}.logo{height:85px}.icon{font-size:55px;color:#0a8f3d;margin:15px}.number{display:inline-block;background:#fff7d6;border:1px solid #ffc107;color:#003d82;padding:12px 22px;border-radius:8px;font-size:1.2rem;font-weight:bold;margin:18px}.btn{display:inline-block;background:#003d82;color:#fff;padding:12px 24px;border-radius:25px;text-decoration:none}
</style>
</head>
<body><main class="box">
<img class="logo" src="/static/site/images/leo-club-logo.png" alt="Leo Club logo">
<div class="icon">✓</div>
<h1>Application Received</h1>
<p>Thank you, <strong>{{ application.full_name }}</strong>. Your membership application has been submitted successfully.</p>
<p>Your application number is:</p>
<div class="number">{{ application.application_number }}</div>
<p>Please keep this number for future communication with Leo Club of Kathmandu Samakhusi.</p>
<a class="btn" href="/">Return to Home</a>
</main></body></html>
